[project]
name = "eco-kb"
version = "0.1.0"
description = "Bot RAG B2B con LangGraph: subgrafos Self-RAG aislados (Soporte / Ventas)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "langgraph>=0.6",
    "langchain>=0.3",
    "langchain-google-genai>=2.1",
    "google-genai>=1.0",
    "psycopg[binary,pool]>=3.2",
    "langgraph-checkpoint-postgres>=2.0",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "pydantic-settings>=2.4",
    "pyyaml>=6.0",
    "google-api-python-client>=2.201.0",
    "google-auth-oauthlib>=1.5.0",
    "pypdf>=6.19.0",
    "mammoth>=1.13.0",
]

[dependency-groups]
dev = ["pytest>=8.0", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/eco_kb"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["integration: requiere Docker/Postgres (docker compose up -d)"]
addopts = "-m 'not integration'"

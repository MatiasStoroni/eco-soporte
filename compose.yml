# Levanta la vista de chat + la API del chatbot. NO levanta Postgres: usa uno existente por red.
#   docker compose up -d --build
# Vista: http://<ip>:${WEB_PORT:-8080}   (el servidor de la vista reenvía /api/* a la API: sin CORS)
name: eco-demo

services:
  api:
    build: ./ECO-KB
    restart: unless-stopped
    env_file: ${API_ENV_FILE:-./ECO-KB/.env}   # GOOGLE_API_KEY, modelos, umbrales
    environment:                                 # las URLs de BD se fijan aquí (anulan las del .env)
      DATABASE_URL_ADMIN: ${DOCKER_DATABASE_URL_ADMIN:-postgresql://eco:eco@postgres-server:5432/ecokb}
      DATABASE_URL_SUPPORT_RO: ${DOCKER_DATABASE_URL_SUPPORT_RO:-postgresql://rag_support_ro:${ECOKB_SUPPORT_PASSWORD:-support_ro_dev}@postgres-server:5432/ecokb}
      DATABASE_URL_SALES_RO: ${DOCKER_DATABASE_URL_SALES_RO:-postgresql://rag_sales_ro:${ECOKB_SALES_PASSWORD:-sales_ro_dev}@postgres-server:5432/ecokb}
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"       # solo para depuración local (/docs); los usuarios entran por la vista
    networks: [default, shared]

  web:
    build: ./chat-view-test
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-8080}:8080"
    networks: [default]

networks:
  # Red del Postgres existente. Se une sola al hacer `up`: no hace falta `docker network connect`.
  shared:
    external: true
    name: ${SHARED_NETWORK:-servicios_compartidos}
